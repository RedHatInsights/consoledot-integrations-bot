workflow: jira-sprint
source: jira
# OpenCode V2/OpenAI profile. Removing these selectors restores Python/Claude
# runtime defaults; native subagents and MCP settings apply only to OpenCode.
runtime: opencode
provider: rehor-openai
model: gpt-6.1-terra
envs:
  - node
  - go
  - patternfly-mcp
  - slack
  - container-scan
# Sandbox image launched by the agent dispatcher for this profile.
image:
  repository: quay.io/redhat-services-prod/hcc-integrations-tenant/consoledot-integrations-bot
  # Newest promoted Konflux build of main.
  tag: latest
# Non-secret profile settings for dispatcher wiring and the sandbox runner.
env:
  BOT_INSTANCE_ID: Jan Nepomucký z Karlova mostu
  BOT_LABEL: hcc-ai-integrations
  BOT_CONFIG_PATH: instance/integrations-config
  BOT_EXECUTION_ENGINE: coordinator
# Declarative preflights (REHOR-231): the complete set for this instance,
# executed by the dispatcher's TS engine (@rehor/preflights) instead of the
# workflow default Python set.
preflights:
  - gh-pr-status
  - gl-mr-status
  - id: jira-sprint
    with:
      label: hcc-ai-integrations
      include_backlog: false
